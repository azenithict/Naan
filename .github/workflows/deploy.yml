name: Deploy bakery to cPanel
on:
  push:
    branches: [main]
    paths:
      - index.html
      - initial-state.js
      - prototype-ui.js
      - style.css
      - app.js
      - storefront.js
      - api/**
      - assets/**
      - tests/order-email.php
      - tests/order-state.php
      - tests/storefront.cjs
      - tests/shop-core.php
      - tests/reset-admin.php
      - deploy/upload.py
      - deploy/verify.py
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naan-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check JavaScript and PHP
        run: |
          node --check app.js
          node --check storefront.js
          node --check prototype-ui.js
          php -l api/order.php
          php -l api/order-email.php
          php -l api/order-state.php
          php tests/order-email.php
          php tests/order-state.php
          php -l api/shop.php
          php -l api/shop-core.php
          php tests/shop-core.php
          php -l api/reset-admin.php
          php tests/reset-admin.php
      - name: Test desktop and mobile ordering
        run: |
          npm install --prefix "$RUNNER_TEMP/baanou-ui" --no-package-lock --no-audit --no-fund playwright-core@1.64.1
          test_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$test_browser_path" ]; then
            "$RUNNER_TEMP/baanou-ui/node_modules/.bin/playwright-core" install --with-deps chromium
            test_browser_path="$(NODE_PATH="$RUNNER_TEMP/baanou-ui/node_modules" node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          fi
          test_data_dir="$(mktemp -d "$RUNNER_TEMP/baanou-data-XXXXXX")"
          BAANOU_DATA_DIR="$test_data_dir" BAANOU_TEST_HTTP=1 php -S 127.0.0.1:3000 -t . > "$RUNNER_TEMP/baanou-http.log" 2>&1 &
          test_server_pid=$!
          trap 'kill "$test_server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3000/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/baanou-ui/node_modules" CHROMIUM_PATH="$test_browser_path" TEST_BASE_URL=http://127.0.0.1:3000/ BAANOU_TEST_DATA_DIR="$test_data_dir" node tests/storefront.cjs
      - name: Upload over verified FTPS
        id: upload
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_ROOT: ${{ vars.FTP_ROOT }}
        run: python3 deploy/upload.py
      - name: Verify live storefront and PHP endpoint
        run: python3 deploy/verify.py
      - name: Inspect public FTPS certificate after a failure
        if: failure() && steps.upload.outcome == 'failure'
        continue-on-error: true
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          host = os.environ.get("FTP_HOST", "")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]*", host):
              raise SystemExit("FTP_HOST must be a hostname only.")
          # Public certificate inspection only: no login or file transfer.
          result = subprocess.run(
              ["openssl", "s_client", "-starttls", "ftp", "-connect", host + ":21",
               "-servername", host, "-showcerts", "-verify_hostname", host],
              input="", text=True, capture_output=True, timeout=25)
          cert = subprocess.run(
              ["openssl", "x509", "-noout", "-subject", "-issuer", "-dates", "-ext", "subjectAltName"],
              input=result.stdout, text=True, capture_output=True, timeout=5)
          print(cert.stdout or "Could not read the public certificate.")
          print("Use the hosting provider's confirmed FTPS hostname matching this certificate; TLS verification remains required.")
          PYTHON
